[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockdb-cnpj"
version = "0.8.0"
description = "Base pública de CNPJ em DuckDB — download, sync, CLI, Streamlit e API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Matheus Cavalcanti Pestana", email = "matheus.pestana@fgv.br" },
]
maintainers = [
  { name = "Matheus Cavalcanti Pestana", email = "matheus.pestana@fgv.br" },
]
keywords = ["cnpj", "duckdb", "receita-federal", "dados-abertos"]
dependencies = [
  "duckdb>=1.1.0",
  "requests>=2.31.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "streamlit>=1.38.0",
  "typer>=0.12.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx2>=2.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "pandas-stubs",
  "types-requests",
]

[project.urls]
Homepage = "https://github.com/mateuspestana/dockdb-cnpj"
Repository = "https://github.com/mateuspestana/dockdb-cnpj"
Changelog = "https://github.com/mateuspestana/dockdb-cnpj/blob/main/CHANGELOG.md"

[project.scripts]
dockdb-cnpj = "dockdb_cnpj.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dockdb_cnpj = ["py.typed", "data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["exemplos"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app/app.py" = ["W291"]  # "  \n" = quebra de linha no Markdown

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
